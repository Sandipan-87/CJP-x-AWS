name: DB Smoke Test

# Engram · exercises agent/memory/db.py's full DAO against the live memory
# cluster. [PLUMBER] Same network rationale as db-migrate.yml (§ its own
# header comment) -- GitHub-hosted runners sit outside the local squid block.
#
# Creates rows under a unique scope_id and deletes them all at the end via
# ON DELETE CASCADE from their own test task_id. Safe to run repeatedly
# against the real memory cluster; never touches any pre-existing row.

on:
  workflow_dispatch: {}

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt -r scripts/requirements-verify.txt

      - name: Fetch both clusters' CA certs
        run: |
          set -e
          curl -fsSL "https://cockroachlabs.cloud/clusters/ee8bc725-9ea6-428a-afd7-7b49a879f3ed/cert" -o cluster-ca.crt
          curl -fsSL "https://cockroachlabs.cloud/clusters/ff3851bb-3869-4772-ba64-fd3076b3917b/cert" -o target-ca.crt
          openssl x509 -in cluster-ca.crt -noout -subject -dates

      - name: Run the DAO smoke test
        env:
          ENGRAM_MEMORY_DSN: ${{ secrets.ENGRAM_MEMORY_DSN }}
        run: python scripts/smoke_test_db.py --sslrootcert "$(pwd)/cluster-ca.crt"

      - name: Run the recall + scoring smoke test
        env:
          ENGRAM_MEMORY_DSN: ${{ secrets.ENGRAM_MEMORY_DSN }}
        run: python scripts/smoke_test_recall.py --sslrootcert "$(pwd)/cluster-ca.crt"

      - name: Run the leases smoke test (kill-and-resume mechanism)
        env:
          ENGRAM_MEMORY_DSN: ${{ secrets.ENGRAM_MEMORY_DSN }}
        run: python scripts/smoke_test_leases.py --sslrootcert "$(pwd)/cluster-ca.crt"

      - name: Run the embeddings write-path smoke test (D9 cache, real Cohere + cluster)
        # Needs an additional repo secret, COHERE_API_KEY, on top of ENGRAM_MEMORY_DSN.
        # Not yet added as of this workflow's authoring -- this step will fail with an
        # auth error until it is; every other step in this file is unaffected.
        env:
          ENGRAM_MEMORY_DSN: ${{ secrets.ENGRAM_MEMORY_DSN }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: python scripts/smoke_test_embeddings.py --sslrootcert "$(pwd)/cluster-ca.crt"

      - name: Run the recall NODE smoke test (agent/nodes/recall.py, the first graph node)
        env:
          ENGRAM_MEMORY_DSN: ${{ secrets.ENGRAM_MEMORY_DSN }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: python scripts/smoke_test_recall_node.py --sslrootcert "$(pwd)/cluster-ca.crt"

      - name: Run the observe NODE smoke test (agent/nodes/observe.py, incident dedupe)
        env:
          ENGRAM_MEMORY_DSN: ${{ secrets.ENGRAM_MEMORY_DSN }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: python scripts/smoke_test_observe_node.py --sslrootcert "$(pwd)/cluster-ca.crt"

      - name: Run the SqlProbe -> observe(node) integration smoke test (target cluster -> memory cluster)
        # ENGRAM_TARGET_DSN is admin-level (used for scenario DDL setup/teardown only --
        # SqlProbe itself only ever runs EXPLAIN). ENGRAM_TARGET_PROBE_DSN (a dedicated
        # read-only role) has not been provisioned yet -- SqlProbe falls back to
        # ENGRAM_TARGET_DSN with a loud warning; see sql_probe.py's module docstring.
        env:
          ENGRAM_MEMORY_DSN: ${{ secrets.ENGRAM_MEMORY_DSN }}
          ENGRAM_TARGET_DSN: ${{ secrets.ENGRAM_TARGET_DSN }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: >
          python scripts/smoke_test_sql_probe.py
          --target-sslrootcert "$(pwd)/target-ca.crt"
          --memory-sslrootcert "$(pwd)/cluster-ca.crt"

      - name: Run the compiled graph smoke test (agent/graph.py, observe -> recall -> END, both branches)
        env:
          ENGRAM_MEMORY_DSN: ${{ secrets.ENGRAM_MEMORY_DSN }}
          ENGRAM_TARGET_DSN: ${{ secrets.ENGRAM_TARGET_DSN }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: >
          python scripts/smoke_test_graph.py
          --target-sslrootcert "$(pwd)/target-ca.crt"
          --memory-sslrootcert "$(pwd)/cluster-ca.crt"

      - name: Run unit tests (T1 scoring + T3 CohereEmbeddings mocks + observe/sql_probe/graph helpers, no cluster/secrets needed)
        run: pytest tests/test_scoring.py tests/test_cohere_embed.py tests/test_observe.py tests/test_sql_probe.py tests/test_graph.py -v
